<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNL Scoreboard Pure Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Oswald', sans-serif;
    }

    body {
      background-color: #0d0d11;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      color: #fff;
    }

    /* --- SCOREBOARD CONTAINER --- */
    .vnl-container {
      transform: scale(1.2);
      margin-bottom: 60px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
    }

    .vnl-scorebug {
      display: flex;
      align-items: center;
      height: 48px;
      background: #1c0936;
      position: relative;
    }

    /* --- TEAM SIDE SECTIONS --- */
    .team-side {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .flag-box {
      width: 58px;
      height: 100%;
      z-index: 2;
    }
    .flag-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .team-info {
      display: flex;
      align-items: center;
      height: 100%;
      background: linear-gradient(180deg, #38126b 0%, #1f0742 100%);
      padding: 0 8px;
      position: relative;
    }

    .team-left .team-info { border-bottom: 3.5px solid #00e5ff; }
    .team-right .team-info { border-bottom: 3.5px solid #ffffff; }

    .team-right { flex-direction: row-reverse; }

    /* Serving Ball */
    .ball-icon {
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 35% 35%, #fff176, #f57f17);
      border-radius: 50%;
      border: 1.5px solid #fff;
      margin: 0 4px;
      display: none;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      z-index: 5;
    }
    .ball-icon.active { display: block; }

    /* --- PERSPECTIVE TEXT ENGINE (USING SVG FOR EXACT RENDER) --- */
    .team-name-box {
      width: 75px;
      height: 58px; /* สูงกว่า bar เพื่อให้ตัวอักษรยื่นทะลุขอบบน-ล่าง */
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -5px 0;
      z-index: 20;
    }

    .team-name-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .team-name-text {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 44px;
      fill: #ffffff;
      transition: transform 0.2s ease;
    }

    /* --- REAL VNL SLANTED PERSPECTIVE EFFECT --- */
    /* ฝั่ง THA (ซ้าย): เมื่อได้แต้ม ปลายซ้ายจะสูงพุ่งทะลุขอบ แล้วสโลปลดระดับไปฝั่งขวา */
    .team-left .point-scored .team-name-text {
      transform: matrix(1, -0.18, 0, 1.25, 0, 2);
    }

    /* ฝั่ง BRA (ขวา): เมื่อได้แต้ม ปลายขวาจะสูงพุ่งทะลุขอบ แล้วสโลปลดระดับไปฝั่งซ้าย (เหมือนรูปที่ 1) */
    .team-right .point-scored .team-name-text {
      transform: matrix(1, 0.18, 0, 1.25, 0, -6);
    }

    /* --- SETS BOX --- */
    .sets-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 6px;
    }
    .sets-label { font-size: 8.5px; color: #b39ddb; font-weight: 700; line-height: 1; }
    .sets-val { font-size: 22px; color: #fff; font-weight: 700; line-height: 1; }

    /* --- SCORE CENTER --- */
    .score-center {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #5b138c 0%, #3a0861 100%);
      height: 100%;
      padding: 0 10px;
    }
    .score-num { font-size: 34px; font-weight: 700; min-width: 24px; text-align: center; line-height: 1; }
    
    .vnl-logo {
      font-weight: 900;
      font-size: 18px;
      font-style: italic;
      color: #ff6d00;
      margin: 0 8px;
      letter-spacing: -1px;
    }

    /* --- CONTROLLER PANEL --- */
    .control-panel {
      background: #180c2e;
      border: 1px solid #4a148c;
      border-radius: 8px;
      padding: 16px;
      width: 520px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .card { background: rgba(255,255,255,0.04); padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); }
    .card h3 { font-size: 12px; color: #80deea; margin-bottom: 6px; }
    
    .inp-group { display: flex; gap: 4px; margin-bottom: 6px; }
    .inp-group div { flex: 1; }
    .inp-group label { display: block; font-size: 9px; color: #aaa; }
    input[type="text"] { 
      background: #090314; 
      border: 1px solid #5c2596; 
      color: #fff; 
      padding: 4px 6px; 
      font-weight: bold; 
      width: 100%; 
      text-transform: uppercase; 
      border-radius: 3px;
      font-size: 12px;
    }

    .btn-row { display: flex; gap: 4px; margin-bottom: 4px; }
    button { background: #4a148c; color: white; border: none; border-radius: 3px; padding: 6px 8px; font-weight: bold; font-size: 11px; cursor: pointer; }
    button:hover { background: #6a1b9a; }
    .btn-pt { background: #00e5ff; color: #000; flex: 1; }
    .btn-srv { background: #ffc400; color: #000; }
    .global-bar { display: flex; gap: 6px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
    .btn-rst { background: #d50000; margin-left: auto; }
  </style>
</head>
<body>

  <!-- SCOREBUG -->
  <div class="vnl-container">
    <div class="vnl-scorebug">
      
      <!-- HOME (LEFT) -->
      <div class="team-side team-left">
        <div class="flag-box">
          <img id="flag-home" src="https://flagcdn.com/w80/th.png" alt="THA">
        </div>
        <div class="team-info">
          <div id="ball-home" class="ball-icon"></div>
          
          <!-- SVG Perspective Team Name -->
          <div class="team-name-box" id="box-home">
            <svg class="team-name-svg" viewBox="0 0 100 50">
              <text x="50%" y="75%" text-anchor="middle" class="team-name-text" id="code-home">THA</text>
            </svg>
          </div>

          <div class="sets-box">
            <span class="sets-label">SETS</span>
            <span id="sets-home" class="sets-val">1</span>
          </div>
        </div>
      </div>

      <!-- SCORE CENTER -->
      <div class="score-center">
        <div id="pts-home" class="score-num">0</div>
        <div class="vnl-logo">VNL</div>
        <div id="pts-away" class="score-num">0</div>
      </div>

      <!-- AWAY (RIGHT) -->
      <div class="team-side team-right">
        <div class="flag-box">
          <img id="flag-away" src="https://flagcdn.com/w80/br.png" alt="BRA">
        </div>
        <div class="team-info">
          <div id="ball-away" class="ball-icon active"></div>
          
          <!-- SVG Perspective Team Name -->
          <div class="team-name-box point-scored" id="box-away">
            <svg class="team-name-svg" viewBox="0 0 100 50">
              <text x="50%" y="75%" text-anchor="middle" class="team-name-text" id="code-away">BRA</text>
            </svg>
          </div>

          <div class="sets-box">
            <span class="sets-label">SETS</span>
            <span id="sets-away" class="sets-val">0</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- CONTROL PANEL -->
  <div class="control-panel">
    <div class="grid">
      
      <!-- HOME CONTROL -->
      <div class="card">
        <h3>ทีมฝั่งซ้าย (HOME)</h3>
        <div class="inp-group">
          <div>
            <label>ชื่อทีม</label>
            <input type="text" id="in-h-name" value="THA" maxlength="4" oninput="updateTeams()">
          </div>
          <div>
            <label>รหัสธงชาติ</label>
            <input type="text" id="in-h-flag" value="th" maxlength="2" oninput="updateTeams()">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-pt" onclick="addPt('home')">+1 แต้ม</button>
          <button onclick="subPt('home')">-1</button>
        </div>
        <div class="btn-row">
          <button class="btn-srv" onclick="setServe('home')">🎾 เสิร์ฟ</button>
          <button onclick="addSet('home')">+1 เซ็ต</button>
        </div>
      </div>

      <!-- AWAY CONTROL -->
      <div class="card">
        <h3>ทีมฝั่งขวา (AWAY)</h3>
        <div class="inp-group">
          <div>
            <label>ชื่อทีม</label>
            <input type="text" id="in-a-name" value="BRA" maxlength="4" oninput="updateTeams()">
          </div>
          <div>
            <label>รหัสธงชาติ</label>
            <input type="text" id="in-a-flag" value="br" maxlength="2" oninput="updateTeams()">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-pt" onclick="addPt('away')">+1 แต้ม</button>
          <button onclick="subPt('away')">-1</button>
        </div>
        <div class="btn-row">
          <button class="btn-srv" onclick="setServe('away')">🎾 เสิร์ฟ</button>
          <button onclick="addSet('away')">+1 เซ็ต</button>
        </div>
      </div>

    </div>

    <div class="global-bar">
      <button onclick="resetPts()">รีเซ็ตคะแนน</button>
      <button class="btn-rst" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    </div>
  </div>

  <script>
    let state = {
      home: { name: 'THA', flag: 'th', pts: 0, sets: 1, serve: false },
      away: { name: 'BRA', flag: 'br', pts: 0, sets: 0, serve: true },
      lastScored: 'away'
    };

    function render() {
      document.getElementById('code-home').textContent = state.home.name;
      document.getElementById('code-away').textContent = state.away.name;

      document.getElementById('flag-home').src = `https://flagcdn.com/w80/${state.home.flag.toLowerCase()}.png`;
      document.getElementById('flag-away').src = `https://flagcdn.com/w80/${state.away.flag.toLowerCase()}.png`;

      document.getElementById('pts-home').innerText = state.home.pts;
      document.getElementById('pts-away').innerText = state.away.pts;
      document.getElementById('sets-home').innerText = state.home.sets;
      document.getElementById('sets-away').innerText = state.away.sets;

      document.getElementById('ball-home').classList.toggle('active', state.home.serve);
      document.getElementById('ball-away').classList.toggle('active', state.away.serve);

      // สลับเอฟเฟกต์ Perspective สโลปเอียงตามผู้ได้คะแนน
      document.getElementById('box-home').classList.toggle('point-scored', state.lastScored === 'home');
      document.getElementById('box-away').classList.toggle('point-scored', state.lastScored === 'away');
    }

    function updateTeams() {
      state.home.name = document.getElementById('in-h-name').value.trim().toUpperCase() || 'THA';
      state.away.name = document.getElementById('in-a-name').value.trim().toUpperCase() || 'BRA';
      state.home.flag = document.getElementById('in-h-flag').value.trim().toLowerCase() || 'th';
      state.away.flag = document.getElementById('in-a-flag').value.trim().toLowerCase() || 'br';
      render();
    }

    function addPt(team) {
      state[team].pts++;
      state.home.serve = (team === 'home');
      state.away.serve = (team === 'away');
      state.lastScored = team;
      render();
    }

    function subPt(team) {
      if (state[team].pts > 0) { state[team].pts--; render(); }
    }

    function addSet(team) { state[team].sets++; render(); }

    function setServe(team) {
      state.home.serve = (team === 'home');
      state.away.serve = (team === 'away');
      render();
    }

    function resetPts() {
      state.home.pts = 0;
      state.away.pts = 0;
      state.lastScored = null;
      render();
    }

    function resetAll() {
      state.home.pts = 0;
      state.away.pts = 0;
      state.home.sets = 0;
      state.away.sets = 0;
      state.lastScored = null;
      render();
    }

    render();
  </script>
</body>
</html>
