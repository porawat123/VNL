<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>VNL Folded Scoreboard</title>
  <style>
    /* --- Base Styles --- */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: transparent; /* สำคัญสำหรับ PRISM */
      font-family: 'Montserrat', sans-serif; /* แนะนำ Montserrat หรือ Arial */
      user-select: none;
    }

    /* --- Scoreboard Container --- */
    #scoreboard-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 450px;
      padding: 20px;
      box-sizing: border-box;
    }

    /* --- Team Bar Styles --- */
    .team-bar {
      display: flex;
      align-items: center;
      height: 60px;
      background: linear-gradient(135deg, #120e2e 0%, #1e183d 100%);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.3s ease; /* สำหรับเอฟเฟกต์ขยับตัว */
    }

    /* สีแถบทีม */
    .team-bar.home { border-left: 8px solid #0056D4; } /* Blue for THA style */
    .team-bar.away { border-left: 8px solid #E60026; } /* Red for BRA style */

    /* --- Team Name with Folded Effect (3D) --- */
    .folded-container {
      perspective: 800px; /* สร้างมิติ 3D */
      flex: 1;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .folded-text {
      font-size: 36px;
      font-weight: 800;
      color: white;
      text-transform: uppercase;
      transform-style: preserve-3d;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      position: relative;
      display: inline-block;
    }

    /* เอฟเฟกต์พับ: หน้าครึ่งซ้าย */
    .folded-text::before {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      color: rgba(255, 255, 255, 0.95);
      transform-origin: 50% 50%;
      transform: rotateY(-35deg) skewY(-5deg); /* พับออกด้านซ้าย */
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
      z-index: 1;
    }

    /* เอฟเฟกต์พับ: หน้าครึ่งขวา */
    .folded-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      right: 0;
      color: rgba(255, 255, 255, 0.95);
      transform-origin: 50% 50%;
      transform: rotateY(35deg) skewY(5deg); /* พับออกด้านขวา */
      clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
      z-index: 2;
    }

    /* เงาตกกระทบตรงกลางรอยพับ */
    .folded-text .shadow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      filter: blur(2px);
      z-index: 3;
    }

    /* --- Set Count Styles --- */
    .set-box {
      width: 80px;
      height: 100%;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-left: 2px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .sets-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      font-weight: 500;
    }

    .set-text {
      font-size: 32px;
      font-weight: 700;
      color: #FFD700; /* Gold color for Sets */
    }

    /* --- Keyframes for Animation: Pop and Shift --- */

    /* 1. Pop effect for Team Names and Scores */
    @keyframes popAndShiftHome {
      0% { transform: scale(1) translateY(0); filter: brightness(1); }
      30% { transform: scale(1.15) translateY(-5px) rotateZ(-1deg); filter: brightness(1.3); box-shadow: 0 10px 20px rgba(0,0,0,0.7); }
      70% { transform: scale(1.05) translateY(-2px); filter: brightness(1.1); }
      100% { transform: scale(1) translateY(0); filter: brightness(1); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    }

    @keyframes popAndShiftAway {
      0% { transform: scale(1) translateY(0); filter: brightness(1); }
      30% { transform: scale(1.15) translateY(5px) rotateZ(1deg); filter: brightness(1.3); box-shadow: 0 10px 20px rgba(0,0,0,0.7); }
      70% { transform: scale(1.05) translateY(2px); filter: brightness(1.1); }
      100% { transform: scale(1) translateY(0); filter: brightness(1); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    }

    /* คลาสกระตุ้นแอนิเมชัน */
    .animation-pop-home { animation: popAndShiftHome 0.5s ease-out; }
    .animation-pop-away { animation: popAndShiftAway 0.5s ease-out; }

    /* --- Control Panel (Hide in Live) --- */
    #control-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(30, 24, 61, 0.95);
      padding: 15px;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .control-row { display: flex; gap: 10px; align-items: center; }
    input[type="text"] {
      width: 80px;
      padding: 6px;
      background: #111;
      color: white;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 12px;
      text-transform: uppercase;
    }

    button {
      padding: 8px 14px;
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    button:hover { background: #555; }
    button:active { transform: scale(0.95); }
    .btn-update { background: #FFD700; color: #1e183d; }
    .btn-update:hover { background: #FFC000; }

  </style>
</head>
<body>

  <!-- Scoreboard -->
  <div id="scoreboard-container">
    <div id="bar-home" class="team-bar home">
      <div class="folded-container">
        <div id="folded-text-home" class="folded-text" data-text="THA">
          <div class="shadow"></div>
        </div>
      </div>
      <div class="set-box">
        <div class="sets-label">SETS</div>
        <div id="set-home" class="set-text">0</div>
      </div>
    </div>

    <div id="bar-away" class="team-bar away">
      <div class="folded-container">
        <div id="folded-text-away" class="folded-text" data-text="JPN">
          <div class="shadow"></div>
        </div>
      </div>
      <div class="set-box">
        <div class="sets-label">SETS</div>
        <div id="set-away" class="set-text">0</div>
      </div>
    </div>
  </div>

  <!-- Control Panel -->
  <div id="control-panel">
    <div class="control-row">
      <input type="text" id="input-home" value="THA" maxlength="3" onkeyup="checkInput()">
      <button onclick="addSet('home')">+1 SET THA</button>
    </div>
    <div class="control-row">
      <input type="text" id="input-away" value="JPN" maxlength="3" onkeyup="checkInput()">
      <button onclick="addSet('away')">+1 SET JPN</button>
    </div>
    <div class="control-row">
      <button onclick="resetScoreboard()">RESET ALL</button>
      <button class="btn-update" onclick="updateTeamNames()">UPDATE NAMES</button>
    </div>
  </div>

  <script>
    let scoreboardData = {
      home: { name: 'THA', sets: 0 },
      away: { name: 'JPN', sets: 0 }
    };

    function updateScoreboardView(team) {
      const data = scoreboardData[team];
      const barElem = document.getElementById(`bar-${team}`);
      const foldedElem = document.getElementById(`folded-text-${team}`);
      const setElem = document.getElementById(`set-${team}`);

      // อัปเดตคะแนน
      setElem.innerText = data.sets;

      // กระตุ้นแอนิเมชันป๊อปอัพ
      const animationClass = `animation-pop-${team}`;
      barElem.classList.remove(animationClass);
      foldedElem.classList.remove('score-update'); // (ไม่ได้ใช้ใน CSS นี้ แต่เก็บไว้)
      
      void barElem.offsetWidth; // Trigger reflow

      barElem.classList.add(animationClass);
      
      // ลบคลาสแอนิเมชันเมื่อเล่นจบ
      setTimeout(() => {
        barElem.classList.remove(animationClass);
      }, 500);
    }

    function addSet(team) {
      scoreboardData[team].sets++;
      updateScoreboardView(team);
    }

    function updateTeamNames() {
      const newHomeName = document.getElementById('input-home').value.trim().toUpperCase();
      const newAwayName = document.getElementById('input-away').value.trim().toUpperCase();

      if (newHomeName.length === 3 && newAwayName.length === 3) {
        scoreboardData.home.name = newHomeName;
        scoreboardData.away.name = newAwayName;

        document.getElementById('folded-text-home').setAttribute('data-text', newHomeName);
        document.getElementById('folded-text-away').setAttribute('data-text', newAwayName);
        
        // (อาจเพิ่มแอนิเมชันสไลด์สลับชื่อทีมที่นี่ได้)
      } else {
        alert("ขออภัยครับ ชื่อทีมต้องเป็นตัวอักษร 3 ตัวพอดี");
      }
    }

    function resetScoreboard() {
      scoreboardData.home.sets = 0;
      scoreboardData.away.sets = 0;
      updateScoreboardView('home');
      updateScoreboardView('away');
    }

    function checkInput() {
      const homeInput = document.getElementById('input-home');
      const awayInput = document.getElementById('input-away');
      homeInput.value = homeInput.value.toUpperCase();
      awayInput.value = awayInput.value.toUpperCase();
    }
    
    // ตั้งค่าเบื้องต้น
    updateScoreboardView('home');
    updateScoreboardView('away');
    
  </style>
</head>
<body>
</body>
</html>
