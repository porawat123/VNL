<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNL Scoreboard - Official Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Oswald', sans-serif;
    }

    body {
      background-color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
      overflow-x: hidden;
    }

    .vnl-scoreboard-wrapper {
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.7));
      transform: scale(1.1);
      margin-bottom: 50px;
    }

    /* --- แผงหลัก Scorebar --- */
    .vnl-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #32105c 0%, #1e093c 100%);
      height: 54px;
      position: relative;
      border-radius: 2px;
    }

    .team-section {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .flag-box {
      width: 65px;
      height: 100%;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .flag-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .team-panel {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 12px;
      position: relative;
      background: linear-gradient(180deg, #43177d 0%, #250b4a 100%);
    }

    .team-left .team-panel { border-bottom: 4px solid #00e5ff; }
    .team-right .team-panel { border-bottom: 4px solid #ffffff; }

    .team-right { flex-direction: row-reverse; }

    .ball-icon {
      width: 24px;
      height: 24px;
      margin: 0 6px;
      background: radial-gradient(circle at 30% 30%, #fdd835, #f57f17);
      border-radius: 50%;
      border: 1.5px solid #fff;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
      display: none;
      z-index: 5;
    }
    .ball-icon.active { display: block; }

    /* --- Container ชื่อทีม --- */
    .team-code {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 85px;
      height: 100%;
      z-index: 10;
      position: relative;
    }

    .char-item {
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      display: inline-block;
      transition: transform 0.2s ease-out;
    }

    /* 
       --- 3D PERSPECTIVE EFFECT (สโลปคางหมูทรง VNL) --- 
    */
    
    /* THA ได้คะแนน: ฝั่งซ้ายใหญ่ สโลปลดลงไปฝั่งขวา */
    .team-left .team-code.point-anim .char-item:nth-child(1) { transform: scaleY(1.4) scaleX(1.1) translateY(-1px); }
    .team-left .team-code.point-anim .char-item:nth-child(2) { transform: scaleY(1.22) translateY(-0.5px); }
    .team-left .team-code.point-anim .char-item:nth-child(3) { transform: scaleY(1.05); }

    /* BRA ได้คะแนน: ฝั่งซ้ายเล็ก สโลปใหญ่สูงทะลุขอบไปฝั่งขวา (เหมือนรูปที่ 1) */
    .team-right .team-code.point-anim .char-item:nth-child(1) { transform: scaleY(1.05); }
    .team-right .team-code.point-anim .char-item:nth-child(2) { transform: scaleY(1.22) translateY(-0.5px); }
    .team-right .team-code.point-anim .char-item:nth-child(3) { transform: scaleY(1.4) scaleX(1.1) translateY(-1px); }

    .sets-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 8px;
      z-index: 2;
    }

    .sets-label { font-size: 10px; font-weight: 500; color: #b39ddb; line-height: 1; }
    .sets-score { font-size: 26px; font-weight: 700; color: #ffffff; line-height: 1; }

    .score-center-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #6a1b9a 0%, #4a148c 100%);
      height: 100%;
      padding: 0 14px;
      position: relative;
      z-index: 2;
    }

    .current-score { font-size: 38px; font-weight: 700; color: #ffffff; min-width: 32px; text-align: center; line-height: 1; }
    .vnl-logo-center { font-weight: 900; font-size: 20px; font-style: italic; color: #ff6d00; margin: 0 10px; }

    /* Control Panel */
    .control-panel {
      background: #1e1136;
      border: 1px solid #4a148c;
      border-radius: 8px;
      padding: 16px;
      color: white;
      width: 580px;
    }
    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .team-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; }
    .team-card h3 { font-size: 13px; color: #80deea; margin-bottom: 6px; }
    .input-row { display: flex; gap: 4px; margin-bottom: 6px; }
    input[type="text"] { background: #0a0518; border: 1px solid #4a148c; color: #fff; padding: 4px 8px; font-weight: bold; width: 100%; text-transform: uppercase; font-size: 12px; }
    .btn-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
    button { background: #4a148c; color: white; border: none; border-radius: 3px; padding: 6px 10px; font-weight: bold; font-size: 11px; cursor: pointer; }
    button:hover { background: #6a1b9a; }
    .btn-point { background: #00e5ff; color: #000; flex: 1; }
    .btn-serve { background: #ffc400; color: #000; }
    .global-actions { display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; justify-content: space-between; }
    .btn-update { background: #00e676; color: #000; }
    .btn-reset { background: #d50000; }
  </style>
</head>
<body>

  <!-- SCOREBOARD BAR -->
  <div class="vnl-scoreboard-wrapper">
    <div class="vnl-bar">
      
      <!-- HOME (LEFT) -->
      <div class="team-section team-left">
        <div class="flag-box">
          <img id="flag-home" src="https://flagcdn.com/w80/th.png" alt="THA">
        </div>
        <div class="team-panel">
          <div id="ball-home" class="ball-icon"></div>
          <div id="code-home" class="team-code"></div>
          <div class="sets-box">
            <span class="sets-label">SETS</span>
            <span id="sets-home" class="sets-score">1</span>
          </div>
        </div>
      </div>

      <!-- SCORE CENTER -->
      <div class="score-center-bar">
        <div id="pts-home" class="current-score">1</div>
        <div class="vnl-logo-center">VNL</div>
        <div id="pts-away" class="current-score">2</div>
      </div>

      <!-- AWAY (RIGHT) -->
      <div class="team-section team-right">
        <div class="flag-box">
          <img id="flag-away" src="https://flagcdn.com/w80/br.png" alt="BRA">
        </div>
        <div class="team-panel">
          <div id="ball-away" class="ball-icon active"></div>
          <div id="code-away" class="team-code point-anim"></div>
          <div class="sets-box">
            <span class="sets-label">SETS</span>
            <span id="sets-away" class="sets-score">0</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- CONTROLLER -->
  <div class="control-panel">
    <div class="panel-grid">
      <div class="team-card">
        <h3>ทีมฝั่งซ้าย (HOME)</h3>
        <div class="input-row">
          <input type="text" id="input-home-name" value="THA" placeholder="ชื่อย่อ 3 ตัว">
          <input type="text" id="input-home-country" value="th" placeholder="รหัสประเทศ">
        </div>
        <div class="btn-row">
          <button class="btn-point" onclick="addPoint('home')">+1 แต้ม</button>
          <button onclick="minusPoint('home')">-1</button>
        </div>
        <div class="btn-row">
          <button class="btn-serve" onclick="setServe('home')">🎾 ลูกเสิร์ฟ</button>
          <button onclick="addSet('home')">+1 เซ็ต</button>
          <button onclick="minusSet('home')">-1 เซ็ต</button>
        </div>
      </div>

      <div class="team-card">
        <h3>ทีมฝั่งขวา (AWAY)</h3>
        <div class="input-row">
          <input type="text" id="input-away-name" value="BRA" placeholder="ชื่อย่อ 3 ตัว">
          <input type="text" id="input-away-country" value="br" placeholder="รหัสประเทศ">
        </div>
        <div class="btn-row">
          <button class="btn-point" onclick="addPoint('away')">+1 แต้ม</button>
          <button onclick="minusPoint('away')">-1</button>
        </div>
        <div class="btn-row">
          <button class="btn-serve" onclick="setServe('away')">🎾 ลูกเสิร์ฟ</button>
          <button onclick="addSet('away')">+1 เซ็ต</button>
          <button onclick="minusSet('away')">-1 เซ็ต</button>
        </div>
      </div>
    </div>

    <div class="global-actions">
      <button class="btn-update" onclick="updateAllInfo()">⚡ บันทึกเปลี่ยนชื่อทีม & ธง</button>
      <button onclick="resetPoints()">รีเซ็ตแต้ม (เซ็ตใหม่)</button>
      <button class="btn-reset" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    </div>
  </div>

  <script>
    let match = {
      home: { name: 'THA', country: 'th', score: 1, sets: 1, serve: false },
      away: { name: 'BRA', country: 'br', score: 2, sets: 0, serve: true },
      lastScored: 'away'
    };

    function generateStyledText(elementId, text) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      const chars = text.split('');
      chars.forEach((char) => {
        const span = document.createElement('span');
        span.className = 'char-item';
        span.innerText = char;
        container.appendChild(span);
      });
    }

    function render() {
      generateStyledText('code-home', match.home.name);
      generateStyledText('code-away', match.away.name);

      document.getElementById('flag-home').src = `https://flagcdn.com/w80/${match.home.country.toLowerCase()}.png`;
      document.getElementById('flag-away').src = `https://flagcdn.com/w80/${match.away.country.toLowerCase()}.png`;

      document.getElementById('pts-home').innerText = match.home.score;
      document.getElementById('pts-away').innerText = match.away.score;
      document.getElementById('sets-home').innerText = match.home.sets;
      document.getElementById('sets-away').innerText = match.away.sets;

      document.getElementById('ball-home').classList.toggle('active', match.home.serve);
      document.getElementById('ball-away').classList.toggle('active', match.away.serve);

      const codeHome = document.getElementById('code-home');
      const codeAway = document.getElementById('code-away');

      codeHome.classList.toggle('point-anim', match.lastScored === 'home');
      codeAway.classList.toggle('point-anim', match.lastScored === 'away');
    }

    function addPoint(team) {
      match[team].score++;
      match.home.serve = (team === 'home');
      match.away.serve = (team === 'away');
      match.lastScored = team;
      render();
    }

    function minusPoint(team) {
      if (match[team].score > 0) { match[team].score--; render(); }
    }

    function addSet(team) { match[team].sets++; render(); }
    function minusSet(team) { if (match[team].sets > 0) { match[team].sets--; render(); } }

    function setServe(team) {
      match.home.serve = (team === 'home');
      match.away.serve = (team === 'away');
      render();
    }

    function updateAllInfo() {
      const hName = document.getElementById('input-home-name').value.trim().toUpperCase() || 'THA';
      const aName = document.getElementById('input-away-name').value.trim().toUpperCase() || 'BRA';
      const hCountry = document.getElementById('input-home-country').value.trim().toLowerCase() || 'th';
      const aCountry = document.getElementById('input-away-country').value.trim().toLowerCase() || 'br';

      match.home.name = hName;
      match.away.name = aName;
      match.home.country = hCountry;
      match.away.country = aCountry;

      render();
    }

    function resetPoints() {
      match.home.score = 0;
      match.away.score = 0;
      match.lastScored = null;
      render();
    }

    function resetAll() {
      match.home.score = 0;
      match.away.score = 0;
      match.home.sets = 0;
      match.away.sets = 0;
      match.lastScored = null;
      render();
    }

    render();
  </script>
</body>
</html>
