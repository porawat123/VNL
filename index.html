<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNL Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Oswald', sans-serif;
    }

    body {
      background-color: transparent;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      overflow-x: hidden;
    }

    .vnl-scoreboard-wrapper {
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
      transform: scale(1.1);
      margin-bottom: 50px;
    }

    .vnl-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #18093d 0%, #2f1266 50%, #150638 100%);
      border: 2px solid #5a38b5;
      border-bottom: 4px solid #00e5ff;
      border-radius: 6px;
      height: 75px;
      overflow: visible;
      position: relative;
    }

    .team-section {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .team-left {
      padding-left: 10px;
      padding-right: 15px;
    }

    .team-right {
      padding-left: 15px;
      padding-right: 10px;
      flex-direction: row-reverse;
    }

    .flag-box {
      width: 48px;
      height: 34px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      border: 1.5px solid rgba(255,255,255,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      background: #222;
    }

    .flag-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ball-icon {
      width: 22px;
      height: 22px;
      margin: 0 8px;
      background: #ffd600;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      opacity: 0;
      visibility: hidden;
    }

    .ball-icon.active {
      opacity: 1;
      visibility: visible;
    }

    .team-code {
      font-family: 'Oswald', sans-serif;
      font-size: 50px;
      font-weight: 700;
      font-style: italic;
      color: #ffffff;
      letter-spacing: -1px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
      display: inline-block;
      min-width: 90px;
      text-align: center;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: perspective(400px) rotateY(0deg) scale(1);
    }

    /* เอฟเฟกต์ยืดบิด 3D เฉพาะตอนได้แต้ม */
    .team-left .team-code.point-anim {
      transform: perspective(400px) rotateY(-25deg) scale(1.15);
      color: #00e5ff;
    }

    .team-right .team-code.point-anim {
      transform: perspective(400px) rotateY(25deg) scale(1.15);
      color: #00e5ff;
    }

    .sets-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 12px;
    }

    .sets-label {
      font-size: 11px;
      font-weight: 700;
      color: #00e5ff;
      letter-spacing: 1px;
      margin-bottom: -2px;
    }

    .sets-score {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
    }

    .score-center {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #09001c 0%, #15023a 100%);
      padding: 0 16px;
      height: 100%;
      border-left: 2px solid #5a38b5;
      border-right: 2px solid #5a38b5;
    }

    .current-score {
      font-size: 52px;
      font-weight: 700;
      color: #ffffff;
      min-width: 45px;
      text-align: center;
      line-height: 1;
    }

    .score-divider {
      font-size: 36px;
      font-weight: 700;
      color: #00e5ff;
      margin: 0 6px;
    }

    .control-panel {
      background: rgba(18, 9, 61, 0.95);
      border: 2px solid #5a38b5;
      border-radius: 12px;
      padding: 18px;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 600px;
      width: 90%;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .team-card {
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 8px;
    }

    .team-card h3 {
      font-size: 14px;
      color: #00e5ff;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    input[type="text"] {
      background: #0d0426;
      border: 1px solid #5a38b5;
      border-radius: 4px;
      color: #fff;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
      text-transform: uppercase;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      background: #5a38b5;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.1s;
    }

    button:hover { background: #734beb; }
    button:active { transform: scale(0.95); }

    .btn-point {
      background: #00b0ff;
      color: #000;
      flex: 1;
      padding: 8px;
      font-size: 13px;
    }
    .btn-point:hover { background: #69e2ff; }

    .btn-serve {
      background: #ffb300;
      color: #000;
    }

    .global-actions {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }

    .btn-update {
      background: #00e676;
      color: #000;
      padding: 8px 16px;
      font-size: 13px;
    }
    .btn-reset {
      background: #d50000;
      padding: 8px 16px;
    }
  </style>
</head>
<body>

  <div class="vnl-scoreboard-wrapper">
    <div class="vnl-bar">
      
      <div class="team-section team-left">
        <div class="flag-box">
          <img id="flag-home" src="https://flagcdn.com/w80/th.png" alt="THA">
        </div>
        <div id="ball-home" class="ball-icon active"></div>
        <div id="code-home" class="team-code">THA</div>
        <div class="sets-box">
          <span class="sets-label">SETS</span>
          <span id="sets-home" class="sets-score">0</span>
        </div>
      </div>

      <div class="score-center">
        <div id="pts-home" class="current-score">0</div>
        <div class="score-divider">:</div>
        <div id="pts-away" class="current-score">0</div>
      </div>

      <div class="team-section team-right">
        <div class="flag-box">
          <img id="flag-away" src="https://flagcdn.com/w80/br.png" alt="BRA">
        </div>
        <div id="ball-away" class="ball-icon"></div>
        <div id="code-away" class="team-code">BRA</div>
        <div class="sets-box">
          <span class="sets-label">SETS</span>
          <span id="sets-away" class="sets-score">0</span>
        </div>
      </div>

    </div>
  </div>

  <div class="control-panel">
    <div class="panel-grid">
      <div class="team-card">
        <h3>ทีมฝั่งซ้าย (HOME)</h3>
        <div class="input-row">
          <input type="text" id="input-home-name" value="THA" placeholder="ชื่อย่อ 3 ตัว">
          <input type="text" id="input-home-country" value="th" placeholder="รหัสประเทศ เช่น th, jp, br">
        </div>
        <div class="btn-row" style="margin-bottom: 6px;">
          <button class="btn-point" onclick="addPoint('home')">+1 แต้ม</button>
          <button onclick="minusPoint('home')">-1</button>
        </div>
        <div class="btn-row">
          <button class="btn-serve" onclick="setServe('home')">🎾 ลูกเสิร์ฟ</button>
          <button onclick="addSet('home')">+1 เซ็ต</button>
          <button onclick="minusSet('home')">-1 เซ็ต</button>
        </div>
      </div>

      <div class="team-card">
        <h3>ทีมฝั่งขวา (AWAY)</h3>
        <div class="input-row">
          <input type="text" id="input-away-name" value="BRA" placeholder="ชื่อย่อ 3 ตัว">
          <input type="text" id="input-away-country" value="br" placeholder="รหัสประเทศ เช่น th, jp, br">
        </div>
        <div class="btn-row" style="margin-bottom: 6px;">
          <button class="btn-point" onclick="addPoint('away')">+1 แต้ม</button>
          <button onclick="minusPoint('away')">-1</button>
        </div>
        <div class="btn-row">
          <button class="btn-serve" onclick="setServe('away')">🎾 ลูกเสิร์ฟ</button>
          <button onclick="addSet('away')">+1 เซ็ต</button>
          <button onclick="minusSet('away')">-1 เซ็ต</button>
        </div>
      </div>
    </div>

    <div class="global-actions">
      <button class="btn-update" onclick="updateAllInfo()">⚡ บันทึกเปลี่ยนชื่อทีม & ธง</button>
      <button onclick="resetPoints()">รีเซ็ตแต้ม (เริ่มเซ็ตใหม่)</button>
      <button class="btn-reset" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    </div>
  </div>

  <script>
    let match = {
      home: { name: 'THA', country: 'th', score: 0, sets: 0, serve: true },
      away: { name: 'BRA', country: 'br', score: 0, sets: 0, serve: false }
    };

    function render() {
      document.getElementById('code-home').innerText = match.home.name;
      document.getElementById('code-away').innerText = match.away.name;
      document.getElementById('flag-home').src = `https://flagcdn.com/w80/${match.home.country.toLowerCase()}.png`;
      document.getElementById('flag-away').src = `https://flagcdn.com/w80/${match.away.country.toLowerCase()}.png`;

      document.getElementById('pts-home').innerText = match.home.score;
      document.getElementById('pts-away').innerText = match.away.score;
      document.getElementById('sets-home').innerText = match.home.sets;
      document.getElementById('sets-away').innerText = match.away.sets;

      if (match.home.serve) {
        document.getElementById('ball-home').classList.add('active');
        document.getElementById('ball-away').classList.remove('active');
      } else if (match.away.serve) {
        document.getElementById('ball-home').classList.remove('active');
        document.getElementById('ball-away').classList.remove('active');
      } else {
        document.getElementById('ball-home').classList.remove('active');
        document.getElementById('ball-away').classList.remove('active');
      }
    }

    function addPoint(team) {
      match[team].score++;
      match.home.serve = (team === 'home');
      match.away.serve = (team === 'away');
      render();

      // เล่นแอนิเมชันยืดบิด 3D เข้าหาตรงกลาง 0.5 วินาที
      const codeElem = document.getElementById(team === 'home' ? 'code-home' : 'code-away');
      codeElem.classList.add('point-anim');

      setTimeout(() => {
        codeElem.classList.remove('point-anim');
      }, 500);
    }

    function minusPoint(team) {
      if (match[team].score > 0) {
        match[team].score--;
        render();
      }
    }

    function addSet(team) {
      match[team].sets++;
      render();
    }

    function minusSet(team) {
      if (match[team].sets > 0) {
        match[team].sets--;
        render();
      }
    }

    function setServe(team) {
      match.home.serve = (team === 'home');
      match.away.serve = (team === 'away');
      render();
    }

    function updateAllInfo() {
      const hName = document.getElementById('input-home-name').value.trim().toUpperCase() || 'THA';
      const aName = document.getElementById('input-away-name').value.trim().toUpperCase() || 'BRA';
      const hCountry = document.getElementById('input-home-country').value.trim().toLowerCase() || 'th';
      const aCountry = document.getElementById('input-away-country').value.trim().toLowerCase() || 'br';

      match.home.name = hName;
      match.away.name = aName;
      match.home.country = hCountry;
      match.away.country = aCountry;

      render();
    }

    function resetPoints() {
      match.home.score = 0;
      match.away.score = 0;
      render();
    }

    function resetAll() {
      match.home.score = 0;
      match.away.score = 0;
      match.home.sets = 0;
      match.away.sets = 0;
      render();
    }

    render();
  </script>
</body>
</html>
