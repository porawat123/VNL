<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNL Scoreboard - Official Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Oswald', sans-serif;
    }

    body {
      background-color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
      overflow-x: hidden;
    }

    .vnl-scoreboard-wrapper {
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.7));
      transform: scale(1.1);
      margin-bottom: 50px;
    }

    /* --- แผงหลัก Scorebar --- */
    .vnl-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #32105c 0%, #1e093c 100%);
      height: 54px;
      position: relative;
      border-radius: 2px;
    }

    .team-section {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    /* --- แผงธงชาติ (เอียงนิดๆ ตามทรง VNL) --- */
    .flag-box {
      width: 65px;
      height: 100%;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .flag-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- แผงชื่อทีม + สกอร์เซ็ต --- */
    .team-panel {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 12px;
      position: relative;
      background: linear-gradient(180deg, #43177d 0%, #250b4a 100%);
    }

    /* เส้นแถบสีฟ้าสว่างใต้ชื่อทีมฝั่ง THA/BRA */
    .team-left .team-panel {
      border-bottom: 4px solid #4db6ac;
    }
    .team-right .team-panel {
      border-bottom: 4px solid #ffffff;
    }

    .team-right {
      flex-direction: row-reverse;
    }

    /* ไอคอนลูกบอลเสิร์ฟ */
    .ball-icon {
      width: 26px;
      height: 26px;
      margin: 0 6px;
      background: radial-gradient(circle at 30% 30%, #fdd835, #f57f17);
      border-radius: 50%;
      border: 1.5px solid #fff;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
      display: none;
      z-index: 5;
    }
    .ball-icon.active {
      display: block;
    }

    /* --- Container ชื่อทีม --- */
    .team-code-container {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 80px;
      z-index: 10;
    }

    /* ตัวอักษรสถานะปกติ */
    .team-code {
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      line-height: 1;
      display: inline-block;
      transition: all 0.2s ease-out;
    }

    /* 
       --- 3D PERSPECTIVE ANIMATION (เหมือนในรูปเป๊ะ) ---
       ขยายให้ปลายฝั่งที่ได้แต้มใหญ่ทะลุขอบบน-ล่าง
    */

    /* THA ได้แต้ม: ตัว T ใหญ่พุ่งสูงทะลุขอบ แล้วสโลปต่ำลงไปทาง A */
    .team-left .team-code.point-anim {
      transform-style: preserve-3d;
      transform-origin: left center;
      transform: perspective(220px) rotateY(28deg) scaleY(1.35) scaleX(1.1) translateY(-1px);
      text-shadow: -2px 4px 10px rgba(0,0,0,0.8);
    }

    /* BRA ได้แต้ม: ตัว A ใหญ่พุ่งสูงทะลุขอบ แล้วสโลปเตี้ยลงไปทาง B (แบบในรูป 1) */
    .team-right .team-code.point-anim {
      transform-style: preserve-3d;
      transform-origin: right center;
      transform: perspective(220px) rotateY(-28deg) scaleY(1.35) scaleX(1.1) translateY(-1px);
      text-shadow: 2px 4px 10px rgba(0,0,0,0.8);
    }

    /* --- กล่อง SETS --- */
    .sets-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 10px;
      z-index: 2;
    }

    .sets-label {
      font-size: 10px;
      font-weight: 500;
      color: #b39ddb;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .sets-score {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
    }

    /* --- สกอร์แต้มตรงกลาง + โลโก้ VNL --- */
    .score-center-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #6a1b9a 0%, #4a148c 100%);
      height: 100%;
      padding: 0 14px;
      position: relative;
      z-index: 2;
    }

    .current-score {
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      min-width: 32px;
      text-align: center;
      line-height: 1;
    }

    /* โลโก้ VNL สไตล์แท่งส้มตรงกลาง */
    .vnl-logo-center {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 12px;
      font-weight: 900;
      font-size: 22px;
      font-style: italic;
      color: #ff6d00;
      letter-spacing: -1px;
      text-shadow: 0 0 4px rgba(255,109,0,0.5);
    }

    /* Control Panel ด้านล่าง */
    .control-panel {
      background: #1e1136;
      border: 1px solid #4a148c;
      border-radius: 8px;
      padding: 16px;
      color: white;
      width: 580px;
    }
    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .team-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; }
    .team-card h3 { font-size: 13px; color: #80deea; margin-bottom: 6px; }
    .input-row { display: flex; gap: 4px; margin-bottom: 6px; }
    input[type="text"] { background: #0a0518; border: 1px solid #4a148c; color: #fff; padding: 4px 8px; font-weight: bold; width: 100%; text-transform: uppercase; }
    .btn-row { display: flex; gap: 4px; }
    button { background: #4a148c; color: white; border: none; border-radius: 3px; padding: 6px 10px; font-weight: bold; font-size: 11px; cursor: pointer; }
    button:hover { background: #6a1b9a; }
    .btn-point { background: #00e5ff; color: #000; flex: 1; }
    .btn-serve { background: #ffc400; color: #000; }
  </style>
</head>
<body>

  <!-- SCOREBOARD BAR -->
  <div class="vnl-scoreboard-wrapper">
    <div class="vnl-bar">
      
      <!-- HOME (LEFT) -->
      <div class="team-section team-left">
        <div class="flag-box">
          <img id="flag-home" src="https://flagcdn.com/w80/th.png" alt="THA">
        </div>
        <div class="team-panel">
          <div id="ball-home" class="ball-icon"></div>
          <div class="team-code-container">
            <span id="code-home" class="team-code">THA</span>
          </div>
          <div class="sets-box">
            <span class="sets-label">SETS</span>
            <span id="sets-home" class="sets-score">1</span>
          </div>
        </div>
      </div>

      <!-- SCORE CENTER -->
      <div class="score-center-bar">
        <div id="pts-home" class="current-score">0</div>
        <div class="vnl-logo-center">VNL</div>
        <div id="pts-away" class="current-score">0</div>
      </div>

      <!-- AWAY (RIGHT) -->
      <div class="team-section team-right">
        <div class="flag-box">
          <img id="flag-away" src="https://flagcdn.com/w80/br.png" alt="BRA">
        </div>
        <div class="team-panel">
          <div id="ball-away" class="ball-icon active"></div>
          <div class="team-code-container">
            <!-- ตั้งค่าเริ่มต้นให้ BRA มีแอนิเมชัน 3D ทะลุขอบแบบใน รูปที่ 1 -->
            <span id="code-away" class="team-code point-anim">BRA</span>
          </div>
          <div class="sets-box">
            <span class="sets-label">SETS</span>
            <span id="sets-away" class="sets-score">0</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- CONTROLLER -->
  <div class="control-panel">
    <div class="panel-grid">
      <div class="team-card">
        <h3>HOME (THA)</h3>
        <div class="btn-row" style="margin-bottom: 6px;">
          <button class="btn-point" onclick="addPoint('home')">+1 แต้ม (ได้คะแนน)</button>
        </div>
        <div class="btn-row">
          <button class="btn-serve" onclick="setServe('home')">🎾 เสิร์ฟ</button>
          <button onclick="addSet('home')">+1 เซ็ต</button>
        </div>
      </div>

      <div class="team-card">
        <h3>AWAY (BRA)</h3>
        <div class="btn-row" style="margin-bottom: 6px;">
          <button class="btn-point" onclick="addPoint('away')">+1 แต้ม (ได้คะแนน)</button>
        </div>
        <div class="btn-row">
          <button class="btn-serve" onclick="setServe('away')">🎾 เสิร์ฟ</button>
          <button onclick="addSet('away')">+1 เซ็ต</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let match = {
      home: { name: 'THA', score: 0, sets: 1, serve: false },
      away: { name: 'BRA', score: 0, sets: 0, serve: true },
      lastScored: 'away' // ตั้งค่าเริ่มต้นให้แสดงแบบรูปที่ 1 (BRA ได้แต้ม)
    };

    function render() {
      document.getElementById('code-home').innerText = match.home.name;
      document.getElementById('code-away').innerText = match.away.name;

      document.getElementById('pts-home').innerText = match.home.score;
      document.getElementById('pts-away').innerText = match.away.score;
      document.getElementById('sets-home').innerText = match.home.sets;
      document.getElementById('sets-away').innerText = match.away.sets;

      // จัดการลูกเสิร์ฟ
      document.getElementById('ball-home').classList.toggle('active', match.home.serve);
      document.getElementById('ball-away').classList.toggle('active', match.away.serve);

      // จัดการ 3D Perspective ตอนได้แต้ม
      const codeHome = document.getElementById('code-home');
      const codeAway = document.getElementById('code-away');

      codeHome.classList.toggle('point-anim', match.lastScored === 'home');
      codeAway.classList.toggle('point-anim', match.lastScored === 'away');
    }

    function addPoint(team) {
      match[team].score++;
      match.home.serve = (team === 'home');
      match.away.serve = (team === 'away');
      match.lastScored = team;
      render();
    }

    function addSet(team) {
      match[team].sets++;
      render();
    }

    function setServe(team) {
      match.home.serve = (team === 'home');
      match.away.serve = (team === 'away');
      render();
    }

    render();
  </script>
</body>
</html>
