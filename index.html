<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNL Scoreboard Clean Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Oswald', sans-serif;
    }

    body {
      background-color: #0d0d11;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 70px;
      color: #fff;
    }

    /* --- SCOREBOARD CONTAINER --- */
    .vnl-scoreboard-wrapper {
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
      transform: scale(1.15);
      margin-bottom: 50px;
    }

    .vnl-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #2b0b57 0%, #150430 100%);
      height: 50px;
      position: relative;
      border-radius: 2px;
      overflow: hidden;
    }

    .team-section {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .flag-box {
      width: 60px;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .flag-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .team-panel {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 12px;
      position: relative;
      background: linear-gradient(180deg, #3d1475 0%, #210947 100%);
    }

    /* แถบไฮไลท์สีขอบล่าง */
    .team-left .team-panel { border-bottom: 3.5px solid #00e5ff; }
    .team-right .team-panel { border-bottom: 3.5px solid #ffffff; }

    .team-right { flex-direction: row-reverse; }

    /* ไอคอนลูกเสิร์ฟ */
    .ball-icon {
      width: 18px;
      height: 18px;
      margin: 0 6px;
      background: radial-gradient(circle at 35% 35%, #fff176, #f57f17);
      border-radius: 50%;
      border: 1.5px solid #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      display: none;
    }
    .ball-icon.active { display: block; }

    /* ชื่อย่อทีม */
    .team-code {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 1px;
      min-width: 65px;
      text-align: center;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    /* แอนิเมชันตอนได้แต้มแบบพอยต์ไฮไลต์ */
    .team-code.point-anim {
      transform: scale(1.15);
      color: #00e5ff;
      text-shadow: 0 0 8px rgba(0,229,255,0.6);
    }

    /* กล่อง SETS */
    .sets-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 6px;
    }
    .sets-label { font-size: 8.5px; font-weight: 600; color: #b39ddb; line-height: 1; }
    .sets-score { font-size: 22px; font-weight: 700; color: #ffffff; line-height: 1; }

    /* สกอร์ตรงกลาง */
    .score-center-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, #5b138c 0%, #3a0861 100%);
      height: 100%;
      padding: 0 14px;
      position: relative;
    }

    .current-score { font-size: 34px; font-weight: 700; color: #ffffff; min-width: 26px; text-align: center; line-height: 1; }
    .vnl-logo-center { font-weight: 900; font-size: 18px; font-style: italic; color: #ff6d00; margin: 0 10px; letter-spacing: -1px; }

    /* CONTROL PANEL */
    .control-panel {
      background: #180c2e;
      border: 1px solid #4a148c;
      border-radius: 8px;
      padding: 16px;
      width: 520px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .team-card { background: rgba(255,255,255,0.04); padding: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); }
    .team-card h3 { font-size: 12px; color: #80deea; margin-bottom: 8px; text-transform: uppercase; }
    
    .input-group { display: flex; gap: 6px; margin-bottom: 8px; }
    .input-field { flex: 1; }
    .input-field label { display: block; font-size: 9px; color: #aaa; margin-bottom: 2px; }
    input[type="text"] { 
      background: #090314; 
      border: 1px solid #5c2596; 
      color: #fff; 
      padding: 5px 8px; 
      font-weight: bold; 
      width: 100%; 
      text-transform: uppercase; 
      border-radius: 4px;
      font-size: 12px;
    }
    input[type="text"]:focus { outline: none; border-color: #00e5ff; }

    .btn-row { display: flex; gap: 6px; margin-bottom: 6px; }
    button { background: #4a148c; color: white; border: none; border-radius: 4px; padding: 7px 10px; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.15s; }
    button:hover { background: #6a1b9a; }
    button:active { transform: scale(0.96); }
    .btn-point { background: #00e5ff; color: #000; flex: 1; }
    .btn-point:hover { background: #18ffff; }
    .btn-serve { background: #ffc400; color: #000; }
    .global-actions { display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }
    .btn-reset { background: #d50000; margin-left: auto; }
  </style>
</head>
<body>

  <!-- SCOREBOARD BAR -->
  <div class="vnl-scoreboard-wrapper">
    <div class="vnl-bar">
      
      <!-- HOME (LEFT) -->
      <div class="team-section team-left">
        <div class="flag-box">
          <img id="flag-home" src="https://flagcdn.com/w80/th.png" alt="THA">
        </div>
        <div class="team-panel">
          <div id="ball-home" class="ball-icon"></div>
          <span id="code-home" class="team-code">THA</span>
          <div class="sets-box">
            <span class="sets-label">SETS</span>
            <span id="sets-home" class="sets-score">1</span>
          </div>
        </div>
      </div>

      <!-- SCORE CENTER -->
      <div class="score-center-bar">
        <div id="pts-home" class="current-score">0</div>
        <div class="vnl-logo-center">VNL</div>
        <div id="pts-away" class="current-score">0</div>
      </div>

      <!-- AWAY (RIGHT) -->
      <div class="team-section team-right">
        <div class="flag-box">
          <img id="flag-away" src="https://flagcdn.com/w80/br.png" alt="BRA">
        </div>
        <div class="team-panel">
          <div id="ball-away" class="ball-icon active"></div>
          <span id="code-away" class="team-code">BRA</span>
          <div class="sets-box">
            <span class="sets-label">SETS</span>
            <span id="sets-away" class="sets-score">0</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- CONTROLLER -->
  <div class="control-panel">
    <div class="panel-grid">
      
      <!-- HOME CONTROLS -->
      <div class="team-card">
        <h3>ทีมฝั่งซ้าย (HOME)</h3>
        <div class="input-group">
          <div class="input-field">
            <label>ชื่อย่อทีม</label>
            <input type="text" id="in-home-name" value="THA" maxlength="4" oninput="updateTeams()">
          </div>
          <div class="input-field">
            <label>รหัสธงชาติ</label>
            <input type="text" id="in-home-flag" value="th" maxlength="2" oninput="updateTeams()">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-point" onclick="addPoint('home')">+1 แต้ม</button>
          <button onclick="minusPoint('home')">-1</button>
        </div>
        <div class="btn-row">
          <button class="btn-serve" onclick="setServe('home')">🎾 เสิร์ฟ</button>
          <button onclick="addSet('home')">+1 เซ็ต</button>
          <button onclick="minusSet('home')">-1 เซ็ต</button>
        </div>
      </div>

      <!-- AWAY CONTROLS -->
      <div class="team-card">
        <h3>ทีมฝั่งขวา (AWAY)</h3>
        <div class="input-group">
          <div class="input-field">
            <label>ชื่อย่อทีม</label>
            <input type="text" id="in-away-name" value="BRA" maxlength="4" oninput="updateTeams()">
          </div>
          <div class="input-field">
            <label>รหัสธงชาติ</label>
            <input type="text" id="in-away-flag" value="br" maxlength="2" oninput="updateTeams()">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-point" onclick="addPoint('away')">+1 แต้ม</button>
          <button onclick="minusPoint('away')">-1</button>
        </div>
        <div class="btn-row">
          <button class="btn-serve" onclick="setServe('away')">🎾 เสิร์ฟ</button>
          <button onclick="addSet('away')">+1 เซ็ต</button>
          <button onclick="minusSet('away')">-1 เซ็ต</button>
        </div>
      </div>

    </div>

    <div class="global-actions">
      <button onclick="resetPoints()">รีเซ็ตแต้มเซ็ตนี้</button>
      <button class="btn-reset" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
    </div>
  </div>

  <script>
    let match = {
      home: { name: 'THA', flag: 'th', score: 0, sets: 1, serve: false },
      away: { name: 'BRA', flag: 'br', score: 0, sets: 0, serve: true },
      lastScored: null
    };

    function render() {
      document.getElementById('code-home').innerText = match.home.name;
      document.getElementById('code-away').innerText = match.away.name;

      document.getElementById('flag-home').src = `https://flagcdn.com/w80/${match.home.flag.toLowerCase()}.png`;
      document.getElementById('flag-away').src = `https://flagcdn.com/w80/${match.away.flag.toLowerCase()}.png`;

      document.getElementById('pts-home').innerText = match.home.score;
      document.getElementById('pts-away').innerText = match.away.score;
      document.getElementById('sets-home').innerText = match.home.sets;
      document.getElementById('sets-away').innerText = match.away.sets;

      document.getElementById('ball-home').classList.toggle('active', match.home.serve);
      document.getElementById('ball-away').classList.toggle('active', match.away.serve);

      document.getElementById('code-home').classList.toggle('point-anim', match.lastScored === 'home');
      document.getElementById('code-away').classList.toggle('point-anim', match.lastScored === 'away');
    }

    function updateTeams() {
      match.home.name = document.getElementById('in-home-name').value.trim().toUpperCase() || 'THA';
      match.away.name = document.getElementById('in-away-name').value.trim().toUpperCase() || 'BRA';
      match.home.flag = document.getElementById('in-home-flag').value.trim().toLowerCase() || 'th';
      match.away.flag = document.getElementById('in-away-flag').value.trim().toLowerCase() || 'br';
      render();
    }

    function addPoint(team) {
      match[team].score++;
      match.home.serve = (team === 'home');
      match.away.serve = (team === 'away');
      match.lastScored = team;
      render();
    }

    function minusPoint(team) {
      if (match[team].score > 0) { match[team].score--; render(); }
    }

    function addSet(team) { match[team].sets++; render(); }
    function minusSet(team) { if (match[team].sets > 0) { match[team].sets--; render(); } }

    function setServe(team) {
      match.home.serve = (team === 'home');
      match.away.serve = (team === 'away');
      render();
    }

    function resetPoints() {
      match.home.score = 0;
      match.away.score = 0;
      match.lastScored = null;
      render();
    }

    function resetAll() {
      match.home.score = 0;
      match.away.score = 0;
      match.home.sets = 0;
      match.away.sets = 0;
      match.lastScored = null;
      render();
    }

    render();
  </script>
</body>
</html>
